<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test - PrepMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
    .quiz-wrap{max-width:640px; margin:60px auto; padding:0 20px;}
    .quiz-card{background:#fff; border:1px solid var(--line); border-radius:16px; padding:32px;}
    .progress-text{color:var(--ink-600); font-size:13px; margin-bottom:10px;}
    .question-text{font-size:19px; font-weight:700; margin-bottom:22px;}
    .option{
        display:block; width:100%; text-align:left; padding:14px 16px; margin-bottom:10px;
        border:1px solid var(--line); border-radius:10px; background:#fff; cursor:pointer; font-size:14.5px;
        font-family:inherit;
    }
    .option:hover{border-color:var(--violet-600);}
    .option.selected{border-color:var(--violet-600); background:var(--violet-50); font-weight:600;}
    .confidence-section{margin-top:24px; display:none;}
    .confidence-section.show{display:block;}
    .confidence-stars{display:flex; gap:8px; margin:14px 0 20px;}
    .star{font-size:28px; cursor:pointer; color:var(--line);}
    .star.filled{color:var(--amber);}
    .result-screen{text-align:center; display:none;}
    .result-screen.show{display:block;}
    .result-score{font-size:48px; font-weight:800; color:var(--violet-600); margin:14px 0;}
</style>
</head>
<body>

<header>
    <div class="brand-block">
        <div class="logo">P</div>
        <div><div class="brand-name">PrepMate</div><div class="brand-sub">AI Placement Preparation</div></div>
    </div>
    <nav><ul><li><a href="student-dashboard.html">Dashboard</a></li></ul></nav>
    <div class="nav-actions"></div>
</header>

<div class="quiz-wrap">
    <div class="quiz-card" id="quiz-card">
        <p class="progress-text" id="progress-text">Loading questions...</p>
        <div id="question-area"></div>

        <div class="confidence-section" id="confidence-section">
            <p style="font-weight:600; margin-bottom:4px;">How confident were you in that answer?</p>
            <p style="color:var(--ink-600); font-size:13px; margin-bottom:6px;">This helps identify topics where you're guessing vs. truly confident.</p>
            <div class="confidence-stars" id="confidence-stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <button class="btn btn-primary btn-block" id="next-btn">Next Question →</button>
        </div>
    </div>

    <div class="quiz-card result-screen" id="result-screen">
        <h2>Test Complete!</h2>
        <div class="result-score" id="result-score">-</div>
        <p id="result-summary" style="color:var(--ink-600);"></p>
        <a href="student-dashboard.html" class="btn btn-primary btn-block btn-lg" style="margin-top:20px;">Back to Dashboard</a>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const category = params.get('category') || 'aptitude';

    let questions = [];
    let currentIndex = 0;
    let selectedOption = null;
    let selectedConfidence = null;
    let answersLog = []; // stores {question_id, selected, correct, confidence}

    async function loadQuestions() {
        const res = await fetch('/api/questions?category=' + category);
        questions = await res.json();
        if (questions.length === 0) {
            document.getElementById('question-area').innerHTML = '<p>No questions found for this category yet.</p>';
            return;
        }
        showQuestion();
    }

    function showQuestion() {
        selectedOption = null;
        selectedConfidence = null;
        document.getElementById('confidence-section').classList.remove('show');
        document.querySelectorAll('.star').forEach(s => s.classList.remove('filled'));

        const q = questions[currentIndex];
        document.getElementById('progress-text').textContent =
            `Question ${currentIndex + 1} of ${questions.length} — ${category.charAt(0).toUpperCase() + category.slice(1)}`;

        const options = ['A', 'B', 'C', 'D'];
        const optionValues = [q.option_a, q.option_b, q.option_c, q.option_d];

        let html = `<div class="question-text">${q.question_text}</div>`;
        options.forEach((letter, i) => {
            html += `<button class="option" data-letter="${letter}">${letter}) ${optionValues[i]}</button>`;
        });
        document.getElementById('question-area').innerHTML = html;

        document.querySelectorAll('.option').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedOption = btn.getAttribute('data-letter');
                document.getElementById('confidence-section').classList.add('show');
            });
        });
    }

    document.getElementById('confidence-stars').addEventListener('click', (e) => {
        if (!e.target.classList.contains('star')) return;
        selectedConfidence = parseInt(e.target.getAttribute('data-value'));
        document.querySelectorAll('.star').forEach(s => {
            s.classList.toggle('filled', parseInt(s.getAttribute('data-value')) <= selectedConfidence);
        });
    });

    document.getElementById('next-btn').addEventListener('click', () => {
        if (!selectedOption || !selectedConfidence) {
            alert('Please select an answer and a confidence rating.');
            return;
        }
        const q = questions[currentIndex];
        answersLog.push({
            question_id: q.id,
            selected: selectedOption,
            correct: q.correct_answer,
            confidence: selectedConfidence
        });

        currentIndex++;
        if (currentIndex < questions.length) {
            showQuestion();
        } else {
            finishTest();
        }
    });

    async function finishTest() {
        const correctCount = answersLog.filter(a => a.selected === a.correct).length;
        const scorePercent = Math.round((correctCount / answersLog.length) * 100);
        const avgConfidence = (answersLog.reduce((sum, a) => sum + a.confidence, 0) / answersLog.length).toFixed(1);

        document.getElementById('quiz-card').style.display = 'none';
        document.getElementById('result-screen').classList.add('show');
        document.getElementById('result-score').textContent = scorePercent + '%';
        document.getElementById('result-summary').textContent =
            `You got ${correctCount} out of ${answersLog.length} correct. Average confidence: ${avgConfidence}/5`;

        // Save the result to the database via Flask
        try {
            await fetch('/api/submit-test', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    test_type: category,
                    score: scorePercent,
                    answers: answersLog
                })
            });
        } catch (err) {
            console.error('Could not save test result', err);
        }
    }

    loadQuestions();
</script>

</body>
</html>
